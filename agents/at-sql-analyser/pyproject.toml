[project]
name = "at-sql-analyser"
version = "0.1.0"
description = "Nova A2A SQL analyst agent: a bounded LangGraph DAG that autonomously plans, executes, validates, and composes answers over the DB MCP server (reads) and typed, permission-gated capabilities (writes)."
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=0.3,<0.4",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "mcp>=1.0,<2",
    "starlette>=1.0.1,<2",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9,<3",
    "pydantic>=2.9,<3",
    "redis>=5,<6",
]

[project.optional-dependencies]
# Langfuse tracing is optional at runtime: the observability layer degrades to a
# no-op when the package is absent or unconfigured, so deployments that don't
# run Langfuse still work and tests stay dependency-light. v3 is the
# OpenTelemetry-native SDK (native @observe / langfuse.langchain.CallbackHandler).
# The langchain umbrella package is required by langfuse.langchain (it does
# ``import langchain`` to guard the integration); without it the CallbackHandler
# import fails and LangChain/LLM calls are never traced.
observability = ["langfuse>=3,<4", "langchain>=0.3,<1"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "types-redis",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S"]
# Tests may use asserts and fixed test vectors; the generated registry mirrors
# the TypeScript source of truth verbatim and is intentionally dense.
# The Langfuse wiring wraps an untyped third-party SDK at a fail-soft boundary:
# Any is intrinsic to its surface (ANN401) and best-effort flush swallows errors
# by design (S110). Both are deliberate, not lint evasion.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106", "S608", "ANN"], "src/at_sql_analyser/observability/langfuse_tracing.py" = ["ANN401", "S110"] }

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Langfuse is an optional runtime extra and ships no type stubs; its decorators
# and client must not taint the typed harness. The wiring module degrades to a
# no-op when the package is absent, so missing imports here are expected.
[[tool.mypy.overrides]]
module = ["langfuse", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
