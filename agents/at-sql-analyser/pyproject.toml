[project]
name = "at-sql-analyser"
version = "0.1.0"
description = "Nova A2A SQL analyst agent: a bounded LangGraph DAG that autonomously plans, executes, validates, and composes answers over the DB MCP server (reads) and typed, permission-gated capabilities (writes)."
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=0.3,<0.4",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "mcp>=1.0,<2",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9,<3",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
# Langfuse tracing is optional at runtime: the observability layer degrades to a
# no-op when the package is absent or unconfigured, so deployments that don't
# run Langfuse still work and tests stay dependency-light.
observability = ["langfuse>=2.50,<3"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S"]
# Tests may use asserts and fixed test vectors; the generated registry mirrors
# the TypeScript source of truth verbatim and is intentionally dense.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106", "S608", "ANN"], "src/at_sql_analyser/authz/nova_authz.py" = ["E501", "I001"] }

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
