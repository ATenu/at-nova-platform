[project]
name = "nova-orchestrator"
version = "0.1.0"
description = "Nova orchestration execution plane: Celery workers + task gateway for secure asynchronous A2A agent orchestration."
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4,<6",
    "redis>=5,<6",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "starlette>=1.0.1,<2",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9,<3",
    "a2a-sdk>=0.3,<0.4",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
]

[project.optional-dependencies]
# Langfuse tracing is optional at runtime: the observability layer degrades to a
# no-op when the package is absent or unconfigured, so the gateway role and the
# tests stay dependency-light. v3 is the OpenTelemetry-native SDK (native
# @observe / langfuse.langchain.CallbackHandler).
# The langchain umbrella package is required by langfuse.langchain (it does
# ``import langchain`` to guard the integration); without it the CallbackHandler
# import fails and LangChain/LLM calls are never traced.
observability = ["langfuse>=3,<4", "langchain>=0.3,<1"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "types-redis",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S"]
# Tests may use asserts and fixed test vectors; the generated registry mirrors
# the TypeScript source of truth verbatim and is intentionally dense.
# The Langfuse wiring wraps an untyped third-party SDK at a fail-soft boundary:
# Any is intrinsic to its surface (ANN401) and best-effort flush swallows errors
# by design (S110). Both are deliberate, not lint evasion.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106", "ANN"], "src/nova_orchestrator/authz/nova_authz.py" = ["E501", "I001"], "src/nova_orchestrator/observability/langfuse_tracing.py" = ["ANN401", "S110"] }

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are evaluated once at definition time.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Celery ships no type stubs; its decorators must not taint our task signatures.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# Langfuse is an optional runtime extra and ships no type stubs. The wiring
# module degrades to a no-op when the package is absent, so missing imports here
# are expected and must not taint the typed orchestration plane.
[[tool.mypy.overrides]]
module = ["langfuse", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
