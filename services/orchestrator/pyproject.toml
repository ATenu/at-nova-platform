[project]
name = "nova-orchestrator"
version = "0.1.0"
description = "Nova orchestration execution plane: Celery workers + task gateway for secure asynchronous A2A agent orchestration."
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4,<6",
    "redis>=5,<6",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9,<3",
    "a2a-sdk>=0.3,<0.4",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "types-redis",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S"]
# Tests may use asserts and fixed test vectors; the generated registry mirrors
# the TypeScript source of truth verbatim and is intentionally dense.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106", "ANN"], "src/nova_orchestrator/authz/nova_authz.py" = ["E501", "I001"] }

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are evaluated once at definition time.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Celery ships no type stubs; its decorators must not taint our task signatures.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
